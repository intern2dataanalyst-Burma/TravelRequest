{# Hunger Pangs brand theme (palette and type from hungerpangs.com), shared by every page #}
<style>
  :root {
    --hp-maroon: #681313;
    --hp-terracotta: #c54b36;
    --hp-terracotta-dark: #a83c29;
    --hp-mustard: #c6ad1a;
    --hp-olive: #7f8e28;
    --hp-cream: #fffeeb;
    --hp-bg: #fdfcf7;          /* page: lighter than the cream header so the bar stands out */
    --hp-surface: #ffffff;     /* cards */
    --hp-tint: #f7f3e6;        /* read-only fields, subtle panels */
    --hp-ink: #1d1d1d;
    --hp-text: #3d3632;
    --hp-muted: #7a6f66;
    --hp-line: #ebe4d3;
    --hp-line-strong: #dcd2bb;
    --hp-radius: 14px;
    --hp-display: "Bricolage Grotesque", system-ui, sans-serif;
    --hp-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--hp-body); background: var(--hp-bg); color: var(--hp-text); font-size: 15px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
  h1, h2, h3, .hp-display { font-family: var(--hp-display); color: var(--hp-ink); letter-spacing: -0.015em; }

  /* Header */
  /* Same as hungerpangs.com: cream bar, no rule, maroon wordmark left, terracotta nav right */
  .hp-header { background: var(--hp-cream); display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; height: 56px; padding: 0 24px; }
  .hp-brand { display: block; flex: 0 1 auto; min-width: 0; text-decoration: none; }
  .hp-wordmark { display: block; width: 286px; height: 18px; max-width: 100%; background: var(--hp-maroon);
    -webkit-mask: url("/static/hp-wordmark.png") 0 0 / 100% 100% no-repeat; mask: url("/static/hp-wordmark.png") 0 0 / 100% 100% no-repeat; }
  .hp-logo-img { height: 36px; width: auto; display: block; }
  .hp-nav a { font-family: var(--hp-display); font-weight: 600; font-size: 16px; color: var(--hp-terracotta); text-decoration: none; white-space: nowrap; }
  .hp-nav a:hover { color: var(--hp-maroon); }
  @media (max-width: 767px) { .hp-header { height: 52px; padding: 0 1rem; } .hp-wordmark { width: 200px; height: 13px; } .hp-nav { display: none; } }

  .page { width: 100%; max-width: 1160px; margin: 0 auto; padding: 2.25rem 1rem 3rem; flex: 1; }
  .page-head { margin-bottom: 1.75rem; }
  .page-head h1 { font-size: clamp(1.5rem, 2.6vw, 1.95rem); font-weight: 700; margin: 0 0 .35rem; }
  .page-head p { color: var(--hp-muted); margin: 0; max-width: 60ch; }

  /* Cards */
  .hp-card { background: var(--hp-surface); border: 1px solid var(--hp-line); border-radius: var(--hp-radius); box-shadow: 0 1px 2px rgba(29,29,29,.04); }
  .hp-card-pad { padding: 1.5rem; }
  @media (min-width: 768px) { .hp-card-pad { padding: 1.75rem 2rem; } }
  .eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--hp-terracotta); }

  /* Form controls */
  .form-label { font-weight: 600; font-size: .86rem; color: var(--hp-ink); margin-bottom: .4rem; }
  .req { color: var(--hp-terracotta); margin-left: 1px; }
  .form-control, .form-select { min-height: 44px; border-radius: 10px; border: 1px solid var(--hp-line-strong); background-color: #fff; font-size: .95rem; padding: .55rem .85rem; color: var(--hp-ink); transition: border-color .15s, box-shadow .15s, background-color .3s; }
  .form-control::placeholder { color: #aaa093; }
  .form-control:hover:not([readonly]), .form-select:hover { border-color: #c9bda1; }
  .form-control:focus, .form-select:focus { border-color: var(--hp-terracotta); box-shadow: 0 0 0 3px rgba(197,75,54,.14); }
  .form-control[readonly] { background-color: var(--hp-tint); border-color: transparent; color: var(--hp-ink); font-weight: 500; cursor: default; }
  .form-control[readonly]:focus { box-shadow: none; }
  .was-validated .form-control:invalid, .form-control.is-invalid { border-color: #c54b36; background-image: none; padding-right: .85rem; }
  .was-validated .form-control:valid:not([readonly]), .form-control.is-valid { border-color: var(--hp-line-strong); background-image: none; padding-right: .85rem; }
  .was-validated .form-select:valid, .was-validated .form-select:invalid { background-position: right .75rem center, center right 2.25rem; }
  .invalid-feedback { color: var(--hp-terracotta-dark); font-size: .8rem; }
  .help { font-size: .8rem; color: var(--hp-muted); margin-top: .35rem; }

  /* Buttons */
  .btn-hp, .btn-hp-ghost { border-radius: 10px; font-weight: 600; font-size: .93rem; padding: .7rem 1.35rem; transition: background .15s, color .15s, border-color .15s; }
  .btn-hp { background: var(--hp-terracotta); border: 1px solid var(--hp-terracotta); color: #fff; }
  .btn-hp:hover, .btn-hp:focus-visible { background: var(--hp-terracotta-dark); border-color: var(--hp-terracotta-dark); color: #fff; }
  .btn-hp:disabled { background: #d9a397; border-color: #d9a397; color: #fff; }
  .btn-hp-ghost { background: transparent; border: 1px solid transparent; color: var(--hp-muted); }
  .btn-hp-ghost:hover { color: var(--hp-ink); background: var(--hp-tint); }

  /* Status pills */
  .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .75rem; border-radius: 999px; font-weight: 600; font-size: .78rem; }
  .pill-pending { background: #fbf3d2; color: #6d5f0c; }
  .pill-ok { background: #eef2dc; color: #4d5716; }
  .pill-bad { background: #fbeae6; color: #9b3523; }

  .notice { display: flex; gap: .75rem; align-items: flex-start; border-radius: 12px; padding: .85rem 1rem; font-size: .9rem; }
  .notice i { margin-top: .2rem; }
  .notice-ok { background: #eef2dc; color: #3f4813; }
  .notice-bad { background: #fbeae6; color: #7c2a1c; }
  .notice-info { background: #fbf3d2; color: #5e520b; }

  .hp-footer { border-top: 1px solid var(--hp-line); color: var(--hp-muted); font-size: .8rem; }
  .hp-footer div { max-width: 1160px; margin: 0 auto; padding: 1.1rem 1rem; }
</style>
