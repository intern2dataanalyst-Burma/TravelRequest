{# Brand header: Hunger Pangs oval mark (or LOGO_URL if set) + app name #}
<header class="hp-header">
  <div class="hp-header-inner">
    <a class="hp-brand" href="/">
      {% if logo_url %}
        <img src="{{ logo_url }}" alt="Hunger Pangs" class="hp-logo-img" onerror="this.style.display='none'">
      {% else %}
        <svg class="hp-mark" viewBox="0 0 200 110" role="img" aria-label="Hunger Pangs">
          <ellipse cx="100" cy="55" rx="96" ry="51" fill="none" stroke="#c54b36" stroke-width="4"/>
          <ellipse cx="100" cy="55" rx="80" ry="40" fill="#c54b36"/>
          <text x="100" y="52" text-anchor="middle" fill="#fde6b0" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="25" textLength="124" lengthAdjust="spacingAndGlyphs">HUNGER</text>
          <text x="100" y="76" text-anchor="middle" fill="#fde6b0" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="25" textLength="104" lengthAdjust="spacingAndGlyphs">PANGS</text>
        </svg>
      {% endif %}
      <span class="hp-divider" aria-hidden="true"></span>
      <span class="hp-app-name">{{ app_name or 'Travel Accommodation Portal' }}</span>
    </a>
    <span class="hp-header-meta"><i class="fas fa-lock me-1"></i> Internal &middot; Travel Desk</span>
  </div>
  <div class="hp-band"></div>
</header>
