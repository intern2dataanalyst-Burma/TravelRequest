{# Brand header: Hunger Pangs oval mark (or LOGO_URL if set) + page title #}
<header class="hp-header">
  <div class="hp-header-inner">
    <div class="hp-brand">
      {% if logo_url %}
        <img src="{{ logo_url }}" alt="Hunger Pangs" class="hp-logo-img" onerror="this.style.display='none'">
      {% else %}
        <svg class="hp-mark" viewBox="0 0 200 110" role="img" aria-label="Hunger Pangs">
          <ellipse cx="100" cy="55" rx="96" ry="51" fill="none" stroke="#c54b36" stroke-width="3"/>
          <ellipse cx="100" cy="55" rx="80" ry="40" fill="#c54b36"/>
          <text x="100" y="52" text-anchor="middle" fill="#fde6b0" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="25" letter-spacing="1" textLength="124" lengthAdjust="spacingAndGlyphs">HUNGER</text>
          <text x="100" y="76" text-anchor="middle" fill="#fde6b0" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="25" letter-spacing="1" textLength="104" lengthAdjust="spacingAndGlyphs">PANGS</text>
        </svg>
      {% endif %}
      <div>
        <div class="eyebrow">Hunger Pangs &middot; Internal</div>
        <h1 class="hp-title">{{ page_title or 'Travel Accommodation Portal' }}</h1>
      </div>
    </div>
    <div class="hp-chip"><i class="fas fa-plane-departure me-1"></i> Ticketing for Travel</div>
  </div>
  <div class="hp-band"></div>
</header>
